headline:
  pt: "IA que conversa, lembra e age — e prova o que faz."
  en: "AI that talks, remembers and acts — and shows its proof."
  es: "IA que conversa, recuerda y actúa — y demuestra lo que hace."
  ja: "会話し、記憶し、行動するAI。そして、その根拠を示す。"
description:
  pt: "A Usami é uma empresa de tecnologia recém-criada. Desenvolve aplicações, plataformas e soluções de IA para outras empresas, com foco em sistemas que conversam, lembram e agem — e que mostram evidências do que fazem."
  en: "Usami is a newly founded technology company. It builds applications, platforms and AI solutions for other companies, focused on systems that talk, remember and act — and show evidence of what they do."
  es: "Usami es una empresa de tecnología recién creada. Desarrolla aplicaciones, plataformas y soluciones de IA para otras empresas, con foco en sistemas que conversan, recuerdan y actúan, y que muestran evidencia de lo que hacen."
  ja: "Usamiは設立されたばかりのテクノロジー企業です。他の企業向けにアプリケーション、プラットフォーム、AIソリューションを開発し、会話し、記憶し、行動するシステムと、その根拠を示すことに重点を置いています。"
