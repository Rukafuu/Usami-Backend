  ja: "Énois — テック従事者のためのSNS"
stack: [Java 25, Spring Boot 4, React 19, TanStack Start, Go, GPL-3.0]
description:
  pt: "Rede social brasileira para quem trabalha com tecnologia: gratuita, sem anúncios e de código aberto. Backend em Spring Boot com arquitetura hexagonal; frontend em React 19 com TanStack Start; design system próprio e API gateway em Go. Lucas é owner da organização, head de frontend e também atua no backend."
  en: "A Brazilian social network for people who work in tech: free, ad-free and open source. Spring Boot backend with hexagonal architecture; React 19 + TanStack Start frontend; its own design system and a Go API gateway. Lucas is the organization's owner, head of frontend, and also works on the backend."
  es: "Red social brasileña para quienes trabajan en tecnología: gratuita, sin anuncios y de código abierto. Backend en Spring Boot con arquitectura hexagonal; frontend en React 19 con TanStack Start; design system propio y API gateway en Go. Lucas es owner de la organización, head de frontend y también trabaja en el backend."
  ja: "テクノロジー分野で働く人のためのブラジルのSNS。無料・広告なし・オープンソース。ヘキサゴナルアーキテクチャのSpring Bootバックエンド、React 19とTanStack Startのフロントエンド、独自のデザインシステムとGo製APIゲートウェイ。Lucasは組織のオーナーでありフロントエンドのヘッド、バックエンドにも携わっています。"
