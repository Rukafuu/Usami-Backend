  es: "Laya es un motor de decisión no autorregresivo de terceros (NandhaKishorM). Lucas envió dos PRs de evaluación aceptadas: robustez al orden de las opciones (#269) y diagnóstico de confusión por presupuesto de tokens (#706). Ninguna toca el runtime del modelo."
  ja: "Layaは第三者(NandhaKishorM)による非自己回帰型の意思決定エンジンです。Lucasは評価に関する2件のPRがマージされました:選択肢の順序に対する頑健性(#269)とトークン予算による交絡の診断(#706)。どちらもモデルのランタイムには触れていません。"
