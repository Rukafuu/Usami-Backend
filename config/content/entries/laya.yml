description:
  pt: "Laya é um motor de decisão não autoregressivo de terceiros (NandhaKishorM). Lucas enviou duas PRs de avaliação aceitas: robustez à ordem das opções (#269) e diagnóstico de confusão por orçamento de tokens (#706). Nenhuma altera o runtime do modelo."
