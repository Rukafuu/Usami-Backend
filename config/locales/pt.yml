    help: |-
      comandos:
        help             esta ajuda
        about            sobre a empresa e o Fuwarch
        projects         lista todos os projetos e status
        skills           stack e áreas de engenharia
        contact          como falar com o fundador
        usami --about    sobre a companion e mascote Usami
        ls [pasta]       lista pastas e arquivos
        cd <pasta>       entra numa pasta (cd .. volta)
        pwd              mostra onde você está
        cat <arquivo>    lê um arquivo
        open <arquivo>   abre no Explorador de Arquivos
        evidence         abre a página de evidências
        ps               lista processos virtuais ativos
        top              abre o Gerenciador de Tarefas
        neofetch         informações do sistema
        whoami           quem é você
        clear            limpa a tela
        exit             fecha o terminal
