        pwd              現在地を表示
        cat <ファイル>   ファイルを読む
        open <ファイル>  ファイルエクスプローラーで開く
        evidence         エビデンスのページを開く
        ps               仮想プロセスを一覧
        top              タスクマネージャーを開く
        neofetch         システム情報
        whoami           あなたは誰
        clear            画面をクリア
