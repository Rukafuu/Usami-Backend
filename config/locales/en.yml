  terminal:
    welcome: "Fuwarch shell 0.1 — type 'help'. (simulated: no real command is executed)"
    help: |-
      commands:
        help             this help
        about            about the company and Fuwarch
        projects         list all projects and status
        skills           stack and engineering areas
        contact          how to reach the founder
        usami --about    about the Usami companion and mascot
        ls [folder]      list folders and files
        cd <folder>      enter a folder (cd .. goes back)
        pwd              show where you are
        cat <file>       read a file
        open <file>      open in the File Explorer
        evidence         open the evidence page
        ps               list active virtual processes
        top              open the Task Manager
        neofetch         system information
        whoami           who you are
        clear            clear the screen
        exit             close the terminal
    not_found: "%{cmd}: command not found. Try 'help'."
    no_such: "%{path}: no such file or folder"
    usage: "usage: %{usage}"
    whoami: "visitor (no sudo)"
    sudo: "visitor is not in the sudoers file. This incident will be reported to Fuwarch."
    rm_root: "rm: removing '/'… wait. This terminal is pretend, and Fuwarch already nibbled your command before it could do any harm. Nothing was deleted. Not the system, not your reputation. (barely)"
    neofetch_note: "emulated in the browser — not yet a Linux distribution"
    read_only: "this terminal is read-only"
