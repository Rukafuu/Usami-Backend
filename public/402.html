<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <title>402 — Operação requer confirmação — Usami</title>
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" href="/brand/favicon-32.png" type="image/png" sizes="32x32">
    <link rel="apple-touch-icon" href="/brand/apple-touch-icon.png">
    <style>
      :root {
        --bg: #100d0c;
        --surface: #211713;
        --surface-2: #2d201a;
        --fg: #f8f2eb;
        --text: #e6d9ca;
        --mute: #bba897;
        --accent: #d4a477;
        --line: rgba(248, 242, 235, 0.14);
        --font-serif: Georgia, "Times New Roman", serif;
        --font-sans: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        --font-mono: ui-monospace, Consolas, monospace;
      }
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        background: var(--bg);
        color: var(--fg);
        font-family: var(--font-sans);
        min-height: 100vh;
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        padding: clamp(16px, 4vw, 32px);
      }
      .error-card {
        max-width: 920px;
        width: 100%;
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 20px;
        overflow: hidden;
        display: grid;
        grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr);
        box-shadow: 0 16px 48px rgba(0, 0, 0, 0.6);
      }
      .error-art-wrap {
        position: relative;
        background: #000;
        min-height: 280px;
      }
      .error-art {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }
      .error-badge {
        position: absolute;
        top: 16px;
        left: 16px;
        background: rgba(16, 13, 12, 0.85);
        color: var(--accent);
        border: 1px solid var(--line);
        padding: 6px 12px;
        border-radius: 999px;
        font-family: var(--font-mono);
        font-size: 0.8125rem;
        font-weight: 600;
        letter-spacing: 0.05em;
      }
      .error-content {
        padding: clamp(24px, 4vw, 40px);
        display: flex;
        flex-direction: column;
        justify-content: center;
      }
      .scene-label {
        font-family: var(--font-mono);
        font-size: 0.75rem;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--mute);
        margin-bottom: 8px;
      }
      h1 {
        font-family: var(--font-serif);
        font-size: clamp(1.8rem, 3.5vw, 2.6rem);
        line-height: 1.15;
        font-weight: 400;
        margin-bottom: 12px;
        color: var(--fg);
      }
      p.lead {
        color: var(--text);
        font-size: clamp(0.95rem, 1.8vw, 1.05rem);
        line-height: 1.55;
        margin-bottom: 24px;
      }
      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
      }
      a.button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 10px 18px;
        border-radius: 10px;
        text-decoration: none;
        font-weight: 500;
        font-size: 0.9375rem;
        transition: background 0.15s ease;
      }
      a.button--primary {
        background: var(--accent);
        color: #211713;
      }
      a.button--primary:hover {
        background: #e6b88a;
      }
      a.button--secondary {
        background: var(--surface-2);
        color: var(--fg);
        border: 1px solid var(--line);
      }
      a.button--secondary:hover {
        background: #39271f;
      }
      @media (max-width: 780px) {
        .error-card { grid-template-columns: 1fr; }
        .error-art-wrap { aspect-ratio: 16 / 9; }
      }
    </style>
  </head>
  <body>
    <div class="error-card">
      <div class="error-art-wrap">
        <img src="/wallpapers/melody-studio-landscape.jpg" alt="Usami no estúdio Fuwarch com fones de ouvido e vinil" class="error-art">
        <span class="error-badge">ERRO HTTP 402</span>
      </div>
      <div class="error-content">
        <p class="scene-label">Usami no estúdio de som Fuwarch</p>
        <h1>Operação requer confirmação</h1>
        <p class="lead">Esta operação necessita de créditos, autorização ou confirmação de assinatura para prosseguir.</p>
        <div class="actions">
          <a href="/pt" class="button button--primary">Voltar ao Início</a>
          <a href="/pt/evidencias" class="button button--secondary">Ver Evidências</a>
        </div>
      </div>
    </div>
  </body>
</html>
